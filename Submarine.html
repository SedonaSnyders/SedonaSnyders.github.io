    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/Submarine/010_20251222_135944 copy.jpg",
            caption: "Submarine 1 (John),as seen during a ship's tour",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/015_20251222_141042 copy.jpg",
            caption: "Submarine 2 (Paul),as seen during a ship's tour",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/020_P1060363-topaz-rawdenoise-sharpen copy.jpg",
            caption: "John, between dives",
            description: "Our first good view of a sub in the water was on December 31, which turned out to be the day before my dive. This is #1, named John. The others in the fleet (two on our ship and two on its sister) are Paul, George, and something else I don't remember."
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/030_20260101_140749 copy.jpg",
            caption: "Getting ready to board",
            description: "The metal rod on the left of the sub was extended before we started boarding,so we had something to hold onto all the way from Zodiac to the ladder going inside"
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/040_20260101_141513 copy.jpg",
            caption: "Inside the sub",
            description: "Looking across to where the other three passengers are"
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/050_20260101_142141 copy.jpg",
            caption: "Me inside the sub, in the middle",
            description: "When the seating platform rotated to face the window, my view was partly obscured by the other two. On the dive we got down to about 400'"
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/060_20260101_143441-topaz-denoise-sharpen-upscale-2x copy.jpg",
            caption: "",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/070_Stars.jpg",
            caption: "Starfish",
            description: "The top two are Antarctic Sun Starfish, also called the Death Star. The others are more like the starfish we are used to."
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/090_20260101_144349-topaz-wonder copy.jpg",
            caption: "Antarctic sea floor",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/100_20260101_144726 copy.jpg",
            caption: "Sea Cucumber",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/110_20260101_150136-topaz-denoise-sharpen.jpg",
            caption: "",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/120_20260101_152016 copy.jpg",
            caption: "Our captain, saying goodbye at the end of our dive",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Submarine/130_P1060395 copy.jpg",
            caption: "Waiting for the tow",
            description: "Ours was the last dive of the day, and the sub will be towed back to the ship"
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
