<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="viewer.css">


</head>

<body>

<header id="caption"></header>

<main>
    <div id="viewer-content">
        <div id="description"></div>
        <img id="image" src="" alt="">
        <video id="video" controls style="display:none;"></video>
    </div>
</main>

<footer>
    <button id="prev">◀ Previous</button>
    <button id="next">Next ▶</button>
    &nbsp;|&nbsp;
    <a href="javascript:window.close()">Close</a>
</footer>

<script>
let raw = window.location.hash.substring(1);
let decoded = decodeURIComponent(raw);

const isLocal = window.location.protocol === "file:";

function getVideoSrc(file) {
    if (isLocal) {
        return "../videos_local/" + file;   // your local folder
    } else {
        return "https://your-storage.example.com/videos/" + file;
    }
}

let data;

if (decoded.startsWith("{")) {

    // thumbnail click (JSON payload)
    data = JSON.parse(decoded);

} else {

    // direct link like #023
    const index = parseInt(decoded) || 0;

    data = {
        index: index,
        items: galleryItems
    };

}

function getScrollContainer() {
    if (main.scrollHeight > main.clientHeight) return main;

    const vc = document.getElementById("viewer-content");
    if (vc && vc.scrollHeight > vc.clientHeight) return vc;

    return document.scrollingElement;
}

let index = data.index;
const items = data.items;

const hashIndex = parseInt(window.location.hash.substring(1));

if (!isNaN(hashIndex)) {
    index = hashIndex;
}

const cap = document.getElementById("caption");
const desc = document.getElementById("description");
const main = document.querySelector("main");   // NEW

const container = document.getElementById("media-container");

const img = document.getElementById("image");
const video = document.getElementById("video");

function resolveVideoSrc(src) {
    if (window.location.protocol === "file:") {
        return src;
    }
    const filename = src.split("/").pop();
    return "https://your-storage.example.com/videos/" + filename;
}

function render() {

    const item = items[index];

    // reset state
    img.classList.remove("expanded");
    main.classList.remove("expanded");

    // reset scroll position
    main.scrollTop = 0;

	if (item.src.toLowerCase().endsWith(".mp4")) {
		video.src = resolveVideoSrc(item.src);
        console.log("Video source:", video.src);
        video.style.display = "block";
        img.style.display = "none";
        video.controls = true;
        video.autoplay = true;
        video.muted = true;      // REQUIRED for autoplay
    } else {
        img.src = item.src;
        img.style.display = "block";
        video.style.display = "none";

        img.onload = fitImage;
    }

    cap.textContent = item.caption || "";
    desc.innerHTML = item.description || "";
}

function preloadAdjacent() {

    const next = (index + 1) % items.length;
    const prev = (index - 1 + items.length) % items.length;

    new Image().src = items[next].src;
    new Image().src = items[prev].src;

}

function fitImage() {

    if (img.classList.contains("expanded")) {
        img.style.maxHeight = "none";
        return;
    }

    const available = main.clientHeight;

    const desc = document.getElementById("description");
    const descHeight = desc ? desc.offsetHeight : 0;

    img.style.maxHeight = (available - descHeight - 20) + "px";

    img.style.maxWidth = "100%";   // ← ADD THIS (important)
}

img.addEventListener("click", () => {

    const expanding = !img.classList.contains("expanded");

    img.classList.toggle("expanded");
    main.classList.toggle("expanded");

    if (expanding) {
        const top = img.getBoundingClientRect().top - main.getBoundingClientRect().top;
        main.scrollTop = top;
    } else {
        main.scrollTop = 0;
    }

    fitImage();
});

window.addEventListener("resize", fitImage);

document.getElementById("next").onclick = () => {
    index = (index + 1) % items.length;
    render();
};

document.getElementById("prev").onclick = () => {
    index = (index - 1 + items.length) % items.length;
    render();
};

document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") document.getElementById("next").click();
    if (e.key === "ArrowLeft") document.getElementById("prev").click();
    if (e.key === "Escape") window.close();
});

img.onload = () => {
    fitImage();
};

render();

</script>


</body>
</html>
