    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/EasterIsland/010_RanoKau20251216_173827 copy.jpg",
            caption: "Rano Kau",
            description: "At Rano Kau we visited the ceremonial village of Orongo and had views of the crater lake and off-shore islands."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/020_RapaNui-flag_20251216_175308 copy.jpg",
            caption: "Rapa Nui flag",
            description: " The center of the reimiro represents a canoe, which makes sense, but the things at the end are supposed to be faces, which I don't see."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/030_Islands_P1050513 copy.jpg",
            caption: "Moto Nui and Moto Iti",
            description: " These smaller islands near Rapa Nui were important in the coming-of-age competition, which involved swimming to to Moto Nui (the larger island), then collecting and returning with a sooty tern egg."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/040_CraterLake_P1050500 copy.jpg",
            caption: "Crater Lake",
            description: "The water at the bottom was a reliable source of fresh water, but not easily accessible"
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/050_FishPetroglyph_P1050502 copy.jpg",
            caption: "Fish Petroglyph",
            description: "The stylized fish is curled around a whatsit."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/060_P1050527 copy.jpg",
            caption: "Modern wooden recreation of a moai",
            description: "Not authentic, but cute."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/100_P1050529 copy.jpg",
            caption: "Rano Raraku Volcano, site of the quarry",
            description: "<p>Perhaps the most important stop of the visit. Site of the quarry where all of the moai came from. Plus all the individual moari that are in their original locations (the ones on platforms had been knocked down during civil unrest and were put back up).</p><p>Several of us were unable to do the walk to see the quarry up close, or chose not to. We enjoyed having the time to take in the full scene. Those who did were glad, but said it was tough.</p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/105_P1050537 copy.jpg",
            caption: "Rano Raraku Volcano, site of the quarry",
            description: "Another view of the quarry area"
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/110_20251217_104508 copy.jpg",
            caption: "Standing sentinel",
            description: "Being able to get close to several of the standing sentinels, which for some reason were left in the quarry area, was a special treat."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/120_P1050540 copy.jpg",
            caption: "Another standing sentinel",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/130_20251217_103450 copy.jpg",
            caption: "More standing sentinels",
            description: "They show different levels of being covered up by the elements."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/140_20251217_101413 copy.jpg",
            caption: "Our first view of Tongariki",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/145_20251217_115219 copy.jpg",
            caption: "Tongariki sign",
            description: "The symbol for the 'ng' sound (voiced velar nasal) in the International Phonetic Alphabet (IPA) is [ŋ]. It is often called 'eng' or 'engma' "
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/150_P1050552 copy.jpg",
            caption: "Tongariki",
            description: "Key Facts About Ahu Tongariki:<br>Structure: It consists of 15 moai, including the heaviest one ever moved on the island, weighing approximately 86 tons.<br>History: The moai were toppled during internal conflicts in the 19th century and later affected by a tsunami in 1960.<br>Restoration: The site was fully restored between 1992 and 1996 by a team of archaeologists and engineers, including support from Japan.<br>Location: Situated near Rano Raraku (the quarry where the statues were carved) and Poike volcano, offering a dramatic backdrop.<br>Significance: It is considered the most significant megalithic monument in Polynesia."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/160_EasterBunnyIsland.jpg",
            caption: "Easter Bunny Island, Rabbit Newie",
            description: "Someone else did this one, which I came across on Easter Week"
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/210_P1050588 copy.jpg",
            caption: "Ahu Nau Nau",
            description: "Ahu Nau Nau is the most elaborate and best-preserved platform of the three that were built in Anakena. When the statues were knocked down during the clashes between the various clans of the island, they were left buried in the sand on the beach, which allowed them to be more protected from erosion than the others."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/230_P1050598 copy.jpg",
            caption: "Ahu Akivi",
            description: "The only moai facing the ocean--to honor the discoverers of the island, rather than inland.<br><br>A particular feature of the seven identical moai statues is that they exactly face sunset during the Spring Equinox and have their backs to the sunrise during the Autumn Equinox. Such an astronomically precise feature is seen only at this location on the island."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/250_P1050608 copy.jpg",
            caption: "Ahu Vai Uri",
            description: "Location: Situated within the Tahai Ceremonial Complex, near the city cemetery of Hanga Roa, accessible via a short walk.<<br>Name Meaning: 'Vai Uri' translates to 'dark water' or 'green water' in the Rapa Nui language.<br>The Moai: The platform holds five moai of varying sizes and levels of degradation, showcasing an evolution in construction styles, with the oldest parts dating back to around the 12th century.<br>History & Restoration: It is part of one of the most important archaeological sites on the island, restored around 1970.Significance: It is a premier spot for watching the sunset, often described as one of the most beautiful views on the island, with the statues silhouetted against the ocean.<br>Surrounding Complex: It is located alongside two other major platforms: Ahu Ko Te Riku (featuring a solitary, restored moai with coral eyes and a topknot) and Ahu Tahai."
        },
    
        {
            src: "../images_2025-26_Antarctica/EasterIsland/260_P1050618.JPG",
            caption: "Ahu Ko Te Riku",
            description: "An approximation to what the moai originally looked like"
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
