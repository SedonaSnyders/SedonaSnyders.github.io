    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/010_20251230_085855 copy.jpg",
            caption: "Weather balloon launch",
            description: "The balloon was launched at precisely 9:00 local time"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/020_20251230_090100 copy.jpg",
            caption: "Weather balloon away",
            description: "Across the globe, balloons are launched simultaneously"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/030__P1060189-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Blue Petrel",
            description: "We saw a lot of these, but hard to get a really good pic."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/040__P1060211-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Black-browed Albatross",
            description: "A very apt name"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/060_P1060170-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Pintado Petrel",
            description: "Also known as Cape Petrel"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/070_P1060241-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Pintado Petrel",
            description: "During the cruise we frequently saw them in flight, but less often resting"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/090_P1060218 copy.jpg",
            caption: "Elephant Island",
            description: "An early view as we were approaching the island. It seems it is not know whether the name comes from its shape, or because elephant seals were seen there."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/100_P1060225 copy.jpg",
            caption: "Elephant Island",
            description: "A view that includes Point Wild, where Shackleton's crew spent four months. The arrow points to its location. It had been hoped that we could get close enough to see the monument there, but the sea ice prevented it. The point is named for Frank Wild, leader of the crew there."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/120_P1060248 copy.jpg",
            caption: "Elephant Island",
            description: "As we were cruising away"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/220_20251231_080656 copy-topaz-upscale-3.7x-sharpen.jpeg",
            caption: "Whale",
            description: "We saw a few Humpback Whales as we neared Greenwich Island. This time just a fluke."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/225_P1060250-361.mp4",
            caption: "",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/230_P1060271 copy.jpg",
            caption: "Whale",
            description: "This time one finished its breakfast gulp right next to the ship"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/240_P1060273 copy.jpg",
            caption: "Whale",
            description: "The two breathing holes identify this as a baleen whale--the toothed whales have just one."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/247_P1060286-289_4000.jpg",
            caption: "Whale",
            description: "A sequence of four images af a humpback finishing its feeding lunge."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/253_P1060293 copy.jpg",
            caption: "Whale",
            description: "A single image af a humpback finishing its feeding lunge."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/260_P1060304-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Gentoo Penguins",
            description: "The largest group we ever saw in the water, near Greenwich Island"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/265_20251231_114642.jpg",
            caption: "On Greenwich Island",
            description: "Here we are, in full gear. The black life jackets are heavy, and hard to get into."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/270_20251231_114447.jpg",
            caption: "Heading toward the Gentoo colony",
            description: "After a fall, Michelle is being helped on the long walk over uneven rocks to the colony"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/275_P1060317 copy.jpg",
            caption: "Gentoos",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/280_P1060308-320 copy.jpg",
            caption: "Gentoo poses",
            description: "Gentoo, Chinstrap, and Adélie penguins are grouped together as brush-tailed"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/290_P1060315 copy.jpg",
            caption: "Brown Skua",
            description: "The Brown Skua is a predatory bird, that loves to eat penguin eggs."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/300_P1060316 copy.jpg",
            caption: "Lichen",
            description: "Roy Rogers used to end each program with the statement ‘May the good Lord take a lichen to ya.’"
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/310_P1060326 copy.jpg",
            caption: "Gentoo colony",
            description: "Each Gentoo couple builds a low rock nest, and then raises its chicks there."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/320_P1060342-348 copy.jpg",
            caption: "Southern elephant seal",
            description: "In the top pose the seal is close to the water, and eyeing us rather lazily. Then it decided to move away."
        },
    
        {
            src: "../images_2025-26_Antarctica/SouthShetlands/330_P1060362-topaz-rawdenoise-sharpen copy.jpg",
            caption: "Gentoo Penguins",
            description: "It is hard to comprehend how many Gentoo Penguins we saw on the trip"
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
