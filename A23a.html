<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Image Viewer for A23a</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gallery.css">
    </head>
    
    
    <body>
      
    <header id="page-header">Historic iceberg A23a</header>
    <div class="gallery">
    
    <figure>
        <a href="viewer/viewer.html"
           class="viewer-link"
           data-index="0">
            <img src="images_2025-26_Antarctica/A23a/010_20251225_083700 copy.jpg"
                 class="thumb"
                 loading="lazy"
                 alt="Alternative text">
        </a>
        <figcaption>Early morning iceberg</figcaption>
    </figure>
    
    </div>
    
    <p><a href="Maps.html" class="back-link">← Back to maps</a></p>
    
    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/A23a/010_20251225_083700 copy.jpg",
            caption: "Early morning iceberg",
            description: "We saw this huge iceberg off the port bow from our cabin, and only later found out that it had broken off from A23a, which we later went by"
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
    
    </body>
    </html>
