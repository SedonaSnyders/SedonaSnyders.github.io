    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/Maps/003_trip_base_map.png",
            caption: "Easter Island pre-trip and Antarctic cruise -- Dec 14 2025 - Jan 6 2026",
            description: "<p>We flew into Santiago, Chile (in our case from Atlanta), spent one night, flew to Easter Island for two nights, then back to the mainland for another night in Santiago and one night in Buenos Aires before flying to Ushuaia to board the Viking Octantis. Our 18-day cruise was followed by a long day of first waiting for the short flight to Buenos Aires,then a long wait at the B.A. airport for the flight back to the States (since US customs in Atlanta is not open 24 hours).</p><p>The Southern Ocean, which I was not taught about when I was young, is shown in <em>light blue</em>.</p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/007_1200px-Easter_Island_map-en-min.jpg",
            caption: "Pre-extension to Easter Island -- Days 2-5, Dec 16-19",
            description: "<p>After landing and checking in at the Taha Tai hotel on the southern side of the Hanga Roa greater metropolitan area, we had a short drive south to the crater lake of Rano Kau in the southwest, which had originally been scheduled for the last day.</p> <P>On our full day we first visited several sites, starting with the quarry area at Rano Raraku volcano to the east, the source of all the moai, and where many are still upright. Next was the restored platform of Tongariki at Hanga Nui Bay, a little farther east, site of 14 moai.</p> <P> On the last day, before flying back to Santiago we visited Ahu a Kivi, site of the seven ocean-facing Moai, erected to honor the discoverers of the island. All the other Moai face inland, to honor (or control) the people. Then the Tahai Ceremonial Complex, with the one Moai that has restored eyes.</P><p><p>See the <a href=\"../EasterIsland.html\" class=\"map-link\">Easter Island photos</a>.</p></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/010_2025-12-20_VikingOctantis-itinerary.png",
            caption: "Viking Octantis cruise -- Days 6-24, Dec 20 - Jan 6",
            description: "<p>We had been warned that the itinerary was tentative, and that weather and sea ice could force changes. That certainly turned out to be true, but the captain and crew did a magnificent job of reacting, so that our first planned stop, at West Point Island in the Falklands, was the only one completely missed. All the others, from South Georgia on, were just rerouted to visit an accessible site.</p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/020_9f09a8b09a3e40d9806ef2002f0f78a7_Voyage_Maps_20th_December_2025__6th_January_2026.png",
            caption: "Ushuaia to Falklands -- Days 6-8, Dec 20-22",
            description: "<p>After a two-day cruise to the Falkland Islands, high winds kept us from being able to do our scheduled first stop, but we had good weather the next day at Port Stanley.</p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/025_Falkland_Islands_map.svg.png",
            caption: "Falkland Islands -- Days 8-9,  December 22-23",
            description: "<p>High winds kept us from being able to make our first planned stop, at Westpoint Island. So we could not see the rockhopper penguins there.</p> <p>It had rained the night before our day at Port Stanley and was still chilly in the morning, so most of the Magellanic Penguins were still in their burrows during our first excursion, but the weather was good for us and it did warm up in the afternoon. Many of us took advantage of the chance to have two shore excursions. We saw Gentoo penguins, and King penguins carrying eggs in the pouch above their feet on our second one.</p><p><p>See the <a href=\"../Falklands.html\" class=\"map-link\">Falkland Islands photos</a>.</p></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/030_07329753ec6c4c4484785cd944e68978_Voyage_Maps_20th_December_2025__6th_January_2026.png",
            caption: "Cruise to South Georgia Island via Iceberg A23a -- Days 10-11, Dec 24-25",
            description: "<p>The highlight of the two-day cruise to South Georgia Island was getting a good view of iceberg A23a, which had been twice as large as Rhode Island when it broke off from the ice shelf in 1986, and was still huge when we passed by. It was great to see this giant as it was falling apart. We saw a lot of ice that day.</p><p><p>See the <a href=\"../A23a.html\" class=\"map-link\">A23a photos</a>.</p></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/035_c3c32780a431410fa593a321739d940d_Voyage_Maps_20th_December_2025__6th_January_2026.png",
            caption: "South Georgia Island -- Days 12-14, Dec 26-28",
            description: "<p>We had light rain on our second stop, Fortuna Bay, but none at Grytviken or Larsen Harbor. We were told that many cruises have less luck.</p> <p>At Grytviken we saw the remains of a whaling station, the tombstone of John Shackleton, and a fair amount of wildlife.</p> <p>At Fortuna Bay huge numbers of Gentoos, many fur seals, and some elephant seals.</p> <p>At Larsen Harbor we had dramatic scenery plus some wildlife, including Weddell Seals.</p><p><p>See the <a href=\"../SouthGeorgia.html\" class=\"map-link\">South Georgia Island photos</a>.</p></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/040_110ef0976a084c969f3e35dbeb8e0137_Voyage_Maps_20th_December_2025__6th_January_2026.png",
            caption: "Cruise from South Georgia to Antarctica -- Days 15-16, Dec 29-30",
            description: "<p>We cruised by Elephant Island, had some time there, and saw the area where Shackleton's crew survived for four months. We proceeded on to Yankee Harbor on Greenwich Island in the South Shetlands (considered part of geographic but not continental Antarctica)."
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/043_Elephant_Island_map-en.svg.png",
            caption: "Elephant Island, the northernmost of the South Shetland Islands* -- Day 16, Dec 30",
            description: "<p>Point Wild is where Ernest Shackleton's crew spent four months waiting to be rescued. It is named for Frank Wild, leader of the stranded crew.</p> <p>We saw the area, but ice in the bay kept us from getting close enough to see the monument erected there in the late 1980s.</p><p><small><small>*As opposed to Fair Isle, the southernmost of the north Shetland Islands</small></small></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/047_GreenwichIsland_map.jpg",
            caption: "Yankee Harbor in Greenwich Island",
            description: "<p>Yankee Harbor is on the south side of the island. The inset at the bottom of the map shows Elephant Island relative to the rest of the South Shetland Islands. <br>Click on the map to enlarge it and allow vertical scrolling. Click again to return to the original format.</p></p><p><p>See the <a href=\"../SouthShetlands.html\" class=\"map-link\">South Shetland Islands photos</a>.</p></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/050_fa27b913e37a42cca68def188a92cf54_Voyage_Maps_20th_December_2025__6th_January_2026.png",
            caption: "Antarctic regions",
            description: "This map highlights three of the regions of Antarctica we visited, while the actual itinereary is shown in the next map."
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/060_b0286a09f26e4790a56545e9e3e62a3d_Voyage_Maps_20th_December_2025__6th_January_2026.png",
            caption: "Antarctic itinerary -- Days 17-20",
            description: "<p>None of the originally described shore excursions happened in the locations originally scheduled, but the captain and crew were able to find safe  and interesting places for us to explore each day</p><p><p>See the <a href=\"../Antarctica.html\" class=\"map-link\">Antarctica photos</a>.</p></p><p><p>See the <a href=\"../Submarine.html\" class=\"map-link\">Submarine photos</a>.</p></p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Maps/Livingston-Island-Map-2010.jpg",
            caption: "",
            description: ""
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
    
    </body>
