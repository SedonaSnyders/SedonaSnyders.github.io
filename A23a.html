    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/A23a/000_Screenshot - 1_17_2026 , 1_38_30 PM.png",

        },

        {

        },
    
        {
            src: "../images_2025-26_Antarctica/A23a/060_20251225_142209 copy.jpg",

        },
    
        {
            src: "../images_2025-26_Antarctica/A23a/070_20251225_174021 copy.jpg",

        },
    
        {
            src: "../images_2025-26_Antarctica/A23a/20251225_174021 copy.jpg",

        },
    
        {
            src: "../images_2025-26_Antarctica/A23a/P1050766 copy.jpg",
            caption: "",
            description: ""
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
