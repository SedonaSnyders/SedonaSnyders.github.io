    <script>
    /*
    IMPORTANT:
    - Thumbnail paths are relative to THIS file
    - Full image paths are relative to viewer/viewer.html
    - The index numbers start with 0, so that the image shown by the viewer matches the thumbnail
    */
    
    const galleryItems = [
        {
            src: "../images_2025-26_Antarctica/Falklands/010_Vulture_20251223_080507 copy.jpg",
            caption: "Turkey Vulture",
            description: "The vulture was waiting patiently when we came ashore. I think it was hoping someone would die"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/020_20251223_090349 copy.jpg",
            caption: "Gypsy Cove sign",
            description: "Our first excursion was to Gypsy Cove, location of a colony of Magellanic penguins"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/030_20251223_091630 copy.jpg",
            caption: "Gypsy Cove",
            description: "<big>Paradise?</big>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/050_P1050670 copy.jpg",
            caption: "Magellanic penguin",
            description: "One of only a few Magellanic penguins we saw poking out of their dens"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/060_P1050675-topaz-rawdenoise-lighting-upscale-2x copy.jpg",
            caption: "Magellanic penguin",
            description: "Returning from the sea"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/065_P1050658 copy.jpg",
            caption: "",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/070_P1050690 copy.jpg",
            caption: "Male Upland Goose",
            description: "Actually a sheldgoose (pied-goose). They act like geese, but are more closeley related to ducks. They reminded me of the Paradise Shelducks we saw in New Zealand, but there the male has a black neck and the female a white one"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/080_P1050691 copy.jpg",
            caption: "Female Upland Goose",
            description: "They mate for life"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/090_P1050694-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Falkland Steamer Ducks",
            description: "Flightless ducks endemic to the Falkland Islands. They get their name from the way they flap their wings while swimming, in a motion reminiscent of an old paddle-wheel steamer."
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/200_20251223_122402 copy.jpg",
            caption: "King and Gentoo Penguins",
            description: "Bluff Cove Lagoon, a private wildlife haven, is home to more than 1,000 breeding pairs of gentoo penguins and a growing colony of king penguins. We were told that this was the last season for the area to be open to the public."
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/210_P1050706 copy.jpg",
            caption: "King Penguins",
            description: "<p>It appeared that all of the King penguins here were carrying eggs. Their mates must have been out to dinner.</p> <p>No way that I know of to determine the sexes here, since they share egg-carrying duties."
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/220_P1050703 copy.jpg",
            caption: "King Penguin with Egg",
            description: "The penguin's toes are visible sticking out under the egg"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/230_20251223_124035 copy.jpg",
            caption: "Gentoo Penguin Colony",
            description: "<p>Since the Falkland Islands have the warmest climate of the places we visited, the Gentoo chicks were more developed than in other colonies we visited. We were required to stay outside the area marked by the flags, but the penguins had no such restrictions.</p>"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/235_20251223_130028.mp4",
            caption: "",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/240_P1050715 copy.jpg",
            caption: "Gentoo parent with chick",
            description: "I want to grow up just like you, so feed me!"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/250_P1050725 copy.jpg",
            caption: "Gentoo parent with chicks",
            description: "The only thing worse than having one always-hungry chick is having two. Or is it the only thing that's better?"
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/255_20251223_125228 copy.jpg",
            caption: "",
            description: ""
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/260_P1050735-topaz-rawdenoise-sharpen-upscale-2x copy.jpg",
            caption: "Two-banded Plover",
            description: "Breeds in Falklands and extreme southern South America. Continental ones winter farther north."
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/270_P1050753 copy.jpg",
            caption: "Ruddy-headed Goose",
            description: "Native to extreme southern South America and the Falklands, but introduced foxes have greatly reduced numbers on the continent."
        },
    
        {
            src: "../images_2025-26_Antarctica/Falklands/290_20251223_133727 copy.jpg",
            caption: "",
            description: ""
        },
    
    ];
    
    document.querySelectorAll(".viewer-link").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
    
            const index = Number(link.dataset.index);
    
            const payload = encodeURIComponent(JSON.stringify({
                index,
                items: galleryItems
            }));
    
            window.open(link.href + "#" + payload, "_blank");
        });
    });
    
    
    window.addEventListener("load", () => {
    
        const hash = window.location.hash.substring(1);
        const index = parseInt(hash);
    
        if (!isNaN(index)) {
    
            const payload = encodeURIComponent(JSON.stringify({
                index: index,
                items: galleryItems
            }));
    
            window.open("viewer/viewer.html#" + payload, "_blank");
    
        }
    
    });
    </script>
